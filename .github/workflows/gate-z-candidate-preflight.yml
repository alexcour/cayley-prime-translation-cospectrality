name: gate-z-candidate-preflight
on:
  push:
    branches:
      - prep/gate-z-0.1.3-unreviewed-archive-2026-10-12
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-candidate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout preflight tooling
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare exact frozen source commit
        run: |
          git worktree add --detach /tmp/cayley-frozen-source 5b5da644038452e9e6cce598b6703e713550e2a9
          test "$(git -C /tmp/cayley-frozen-source rev-parse HEAD)" = "5b5da644038452e9e6cce598b6703e713550e2a9"
          test -z "$(git -C /tmp/cayley-frozen-source status --porcelain)"
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact source calculations
        run: |
          python3 /tmp/cayley-frozen-source/reproducibility/verify_exact.py --output /tmp/cayley_exact_result.json
      - name: Build staged work archive and integrity controls
        run: |
          python3 archive_preparation/build_candidate.py /tmp/cayley-frozen-source /tmp/cayley-archive-out
          cd /tmp/cayley-archive-out
          sha256sum -c CANDIDATE_SHA256SUMS.txt
          python3 - <<'PY'
          import pathlib, zipfile, hashlib
          p = next(pathlib.Path('.').glob('*.zip'))
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              root = z.namelist()[0].split('/')[0]
              manifest = z.read(root+'/archival/FILE_SHA256SUMS.txt').decode()
              for line in manifest.splitlines():
                  checksum, filename = line.split('  ', 1)
                  assert hashlib.sha256(z.read(root+'/'+filename)).hexdigest() == checksum, filename
              print('Verified archive entry checksums:', len(manifest.splitlines()))
          PY
      - name: Upload temporary work archive candidate
        uses: actions/upload-artifact@v4
        with:
          name: cayley-0.1.3-review-GATE-Z-HOLD-candidate
          path: |
            /tmp/cayley-archive-out/*.zip
            /tmp/cayley-archive-out/CANDIDATE_SHA256SUMS.txt
            /tmp/cayley-archive-out/BUILD_REPORT.json
          retention-days: 30
          if-no-files-found: error
