name: audit-claims
on:
  push:
    paths:
      - 'audit/**'
      - 'proofs/**'
      - '.github/workflows/audit-claims.yml'
  pull_request:
    paths:
      - 'audit/**'
      - 'proofs/**'
      - '.github/workflows/audit-claims.yml'
jobs:
  claim-provenance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 Node24
        with:
          python-version: '3.12'
      - name: Validate proof-source hashes and conservative scientific gates
        run: python3 audit/verify_claims.py
