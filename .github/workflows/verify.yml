name: verify

on:
  push:
  pull_request:

jobs:
  exact-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24)
        with:
          python-version: '3.12'
      - name: Run exact publication checks
        run: python3 reproducibility/verify_exact.py --output /tmp/results_local.json
      - name: Validate JSON syntax
        run: |
          python3 -m json.tool reproducibility/results/results.json >/dev/null
          python3 -m json.tool reproducibility/results/mixed_review_new.json >/dev/null
          python3 -m json.tool reproducibility/results/p3_120_review_new.json >/dev/null
          python3 -m json.tool reproducibility/results/pge5_416_review_new.json >/dev/null
      # The checksum manifest describes the branch snapshot, not GitHub's synthetic PR merge.
      # Keep all preceding scientific checks on the merge checkout.
      - name: Restore PR source snapshot for manifest
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check manifest
        run: sha256sum -c SHA256SUMS.txt

  manuscript-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - name: Install LaTeX
        run: sudo apt-get update && sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-fonts-recommended lmodern
      - name: Build manuscript
        working-directory: manuscript
        run: |
          mkdir -p /tmp/cayley-pdf
          pdflatex -interaction=nonstopmode -halt-on-error -output-directory=/tmp/cayley-pdf structured_cayley.tex
          pdflatex -interaction=nonstopmode -halt-on-error -output-directory=/tmp/cayley-pdf structured_cayley.tex
